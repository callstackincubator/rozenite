packages:
  - packages/*
  - packages/expo-atlas-plugin/metro-fixtures/*
  - libs/*
  - apps/*
  - website

catalog:
  react: '19.2.3'
  react-dom: '19.2.3'
  '@types/react': '~19.2.3'
  '@types/react-dom': '~19.2.3'
  react-native: '0.86.0'
  vite: '^7.3.1'
overrides:
  vite: 'catalog:'
  # Astro 7 needs Vite 8; the rest of the repo stays on the Vite 7 catalog entry.
  'astro>vite': '^8.3.1'
  '@astrojs/react>vite': '^8.3.1'
  '@vitejs/plugin-react>vite': '^8.3.1'
  '@microsoft/api-extractor': 7.48.1
  metro-config: 0.84.4
nodeLinker: hoisted
autoInstallPeers: false
strictPeerDependencies: false
loglevel: warn
allowBuilds:
  '@apollo/protobufjs': true
  '@swc/core': true
  core-js: true
  electron: true
  esbuild: true
  lefthook: true
  react-native-mmkv: true
  react-native-nitro-modules: true
  sqlite3: true
  unrs-resolver: true
