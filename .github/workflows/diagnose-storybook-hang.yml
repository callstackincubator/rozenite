# TEMPORARY diagnostic. Delete this file and its branch once the Storybook
# build hang is understood — it exists only to answer one question that
# cannot be answered off a runner: `storybook build` completes in ~12s on
# macOS and exits 36ms after its last line, but wedges on ubuntu-latest.
#
# Each variant runs the build DIRECTLY (not through Turborepo, so Turbo is
# ruled out) under a hard timeout, and never fails the job. What matters is
# the pair of numbers each one prints:
#
#   exit=124/137 AND saw-completion=1  -> the build finished but the process
#                                         never exited: a leaked handle, and
#                                         whichever variant flips it names it
#   exit=124/137 AND saw-completion=0  -> it stalls mid-build: slowness or a
#                                         deadlock, not an exit problem
#   exit=0                             -> that variant is healthy
#
# Pass 1 answered that: every variant exited in ~15s. But it wrote to a FILE,
# and Turborepo captures task output through a PIPE, which only reaches EOF
# once every descendant holding the write end lets go. Pass 2 (the P-*
# variants) reruns the same matrix with stdout on a pipe and reports whether
# the pipe drains after the build announces completion:
#
#   saw-completion=1 AND pipe-drained=0 -> the build finished but something is
#                                          still holding the pipe: that is the
#                                          hang, and the ps dump names it
#   saw-completion=1 AND pipe-drained=1 -> that variant is clean
name: Diagnose Storybook hang

on:
  push:
    branches: [ci/diagnose-storybook-hang]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report runner shape
        run: |
          echo "node: $(node --version)"
          echo "cpus: $(nproc)"
          free -m || true

      # Storybook has to be built at least once for its dependencies
      # (@rozenite/ui) to exist, or every variant fails for the wrong reason.
      - name: Build @rozenite/ui
        run: pnpm turbo run build --filter=@rozenite/ui

      # Control: pass 1 showed this exits in ~15s. Kept as a baseline.
      - name: A - plain build, output to a file
        run: .github/scripts/diagnose-storybook.sh "A-plain"

      - name: P1 - plain build, output on a pipe
        run: .github/scripts/diagnose-storybook-pipe.sh "P1-plain-pipe"

      - name: P2 - pipe, telemetry disabled
        env:
          SB_EXTRA_ARGS: '--disable-telemetry'
        run: .github/scripts/diagnose-storybook-pipe.sh "P2-pipe-no-telemetry"

      - name: P3 - pipe, without addon-mcp
        env:
          SB_DROP_ADDONS: 'addon-mcp'
        run: .github/scripts/diagnose-storybook-pipe.sh "P3-pipe-no-mcp"

      - name: P4 - pipe, docs addon only
        env:
          SB_DROP_ADDONS: 'addon-mcp addon-vitest addon-a11y chromatic-com'
        run: .github/scripts/diagnose-storybook-pipe.sh "P4-pipe-docs-addon-only"

      # Pass 3: the build is innocent in both passes above, so suspect the
      # supervisor. Same small graph each time; the question is only whether
      # turbo ever prints its summary and exits.
      - name: T1 - turbo, as CI runs it
        run: .github/scripts/diagnose-turbo.sh "T1-turbo-plain"

      - name: T2 - turbo, telemetry disabled
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: .github/scripts/diagnose-turbo.sh "T2-turbo-no-telemetry"

      - name: T3 - turbo, no daemon
        env:
          TURBO_EXTRA_ARGS: '--no-daemon'
        run: .github/scripts/diagnose-turbo.sh "T3-turbo-no-daemon"

      - name: N - build-time network probes and rspress alone
        if: always()
        run: .github/scripts/diagnose-network.sh

      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/diagnose-summary.txt" || echo "no summary written"
