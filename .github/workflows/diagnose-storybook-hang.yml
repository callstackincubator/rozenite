# TEMPORARY diagnostic. Delete this file and its branch once the Storybook
# build hang is understood — it exists only to answer one question that
# cannot be answered off a runner: `storybook build` completes in ~12s on
# macOS and exits 36ms after its last line, but wedges on ubuntu-latest.
#
# Each variant runs the build DIRECTLY (not through Turborepo, so Turbo is
# ruled out) under a hard timeout, and never fails the job. What matters is
# the pair of numbers each one prints:
#
#   exit=124/137 AND saw-completion=1  -> the build finished but the process
#                                         never exited: a leaked handle, and
#                                         whichever variant flips it names it
#   exit=124/137 AND saw-completion=0  -> it stalls mid-build: slowness or a
#                                         deadlock, not an exit problem
#   exit=0                             -> that variant is healthy
name: Diagnose Storybook hang

on:
  push:
    branches: [ci/diagnose-storybook-hang]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report runner shape
        run: |
          echo "node: $(node --version)"
          echo "cpus: $(nproc)"
          free -m || true

      # Storybook has to be built at least once for its dependencies
      # (@rozenite/ui) to exist, or every variant fails for the wrong reason.
      - name: Build @rozenite/ui
        run: pnpm turbo run build --filter=@rozenite/ui

      - name: A - plain build
        run: .github/scripts/diagnose-storybook.sh "A-plain"

      - name: B - telemetry disabled
        env:
          SB_EXTRA_ARGS: '--disable-telemetry'
        run: .github/scripts/diagnose-storybook.sh "B-no-telemetry"

      - name: C - without addon-mcp
        env:
          SB_DROP_ADDONS: 'addon-mcp'
        run: .github/scripts/diagnose-storybook.sh "C-no-mcp"

      - name: D - docs addon only
        env:
          SB_DROP_ADDONS: 'addon-mcp addon-vitest addon-a11y chromatic-com'
        run: .github/scripts/diagnose-storybook.sh "D-docs-addon-only"

      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/diagnose-summary.txt" || echo "no summary written"
